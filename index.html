<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Daily Dose</title>
  <meta name="description" content="Daily history games built from real photographs: where was it taken, and when?" />
  <meta name="theme-color" content="#f6f1e6" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/hub.css?v=20261107b" />
</head>
<body>
  <header class="hub-top">
    <a href="./" class="hub-brand" aria-label="The Daily Dose: all games">
      <img src="./assets/favicon.svg" alt="" width="34" height="34" />
      <span>The <em>Daily</em> Dose</span>
    </a>
    <a href="./signin.html" class="hub-signin" id="hub-account">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5Z"/></svg>
      <span id="hub-account-label">Sign in</span>
    </a>
  </header>

  <main class="hub-main">
    <div class="hub-head">
      <h1 class="hub-h">Play today</h1>
      <p class="hub-date" id="hub-date" aria-label="Today’s date">
        <span class="hub-date-day" id="hub-day"></span>
        <span id="hub-month"></span>
      </p>
    </div>

    <div class="hub-grid">
      <!-- ============================== SNAPSHOT ============================== -->
      <a class="game-card card-snapshot" href="./snapshot.html">
        <span class="game-art" aria-hidden="true">
          <svg viewBox="0 0 300 220">
            <!-- map -->
            <g opacity=".28" fill="none" stroke="#f6f1e6" stroke-width="2">
              <path d="M10 70 C60 40 90 90 140 60 S230 40 290 70" />
              <path d="M10 150 C70 120 110 170 160 140 S240 120 290 150" />
              <path d="M70 10 C60 70 90 130 70 210" />
              <path d="M220 10 C240 80 200 140 230 210" />
            </g>
            <!-- photo print -->
            <g transform="rotate(-7 150 110)">
              <rect x="70" y="38" width="160" height="134" rx="4" fill="#f6f1e6" />
              <rect x="80" y="48" width="140" height="96" fill="#c9a46a" />
              <circle cx="190" cy="72" r="13" fill="#f3d79a" />
              <path d="M80 144 L80 118 L112 92 L138 112 L162 88 L220 128 L220 144 Z" fill="#7b5a34" />
              <path d="M80 144 L80 128 L122 108 L160 126 L220 116 L220 144 Z" fill="#5c4226" />
              <rect x="80" y="152" width="70" height="8" rx="4" fill="#d7cbb3" />
            </g>
            <!-- pin -->
            <g transform="translate(206 26)">
              <path d="M22 0 C10 0 0 10 0 22 C0 38 22 60 22 60 C22 60 44 38 44 22 C44 10 34 0 22 0 Z" fill="#e8553f" stroke="#1d2b28" stroke-width="3" />
              <circle cx="22" cy="22" r="8" fill="#1d2b28" />
            </g>
            <!-- year tag -->
            <g transform="translate(36 150) rotate(-8)">
              <rect width="74" height="34" rx="9" fill="#f2b84b" stroke="#1d2b28" stroke-width="3" />
              <text x="37" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="19" fill="#1d2b28">19??</text>
            </g>
          </svg>
        </span>
        <span class="game-name">Snapshot</span>
        <span class="game-desc">One photograph. Pin where it was taken and guess the year.</span>
      </a>

      <!-- ============================== TIMELINE ============================== -->
      <div class="game-card card-timeline is-soon" aria-disabled="true">
        <span class="game-badge">Coming soon</span>
        <span class="game-art" aria-hidden="true">
          <svg viewBox="0 0 300 220">
            <line x1="20" y1="132" x2="280" y2="132" stroke="#efe6ff" stroke-width="4" stroke-linecap="round" />
            <g fill="#efe6ff">
              <circle cx="40" cy="132" r="7" /><circle cx="95" cy="132" r="7" /><circle cx="150" cy="132" r="7" />
              <circle cx="205" cy="132" r="7" /><circle cx="260" cy="132" r="7" />
            </g>
            <g stroke="#2b1d47" stroke-width="3">
              <rect x="16" y="58" width="48" height="56" rx="4" fill="#f6f1e6" transform="rotate(-5 40 86)" />
              <rect x="126" y="54" width="48" height="56" rx="4" fill="#f6f1e6" transform="rotate(4 150 82)" />
              <rect x="236" y="58" width="48" height="56" rx="4" fill="#f6f1e6" transform="rotate(-3 260 86)" />
              <rect x="71" y="150" width="48" height="56" rx="4" fill="#f6f1e6" transform="rotate(5 95 178)" />
              <rect x="181" y="150" width="48" height="56" rx="4" fill="#f6f1e6" transform="rotate(-4 205 178)" />
            </g>
            <g fill="#b79be6">
              <rect x="22" y="66" width="36" height="28" transform="rotate(-5 40 86)" />
              <rect x="132" y="62" width="36" height="28" transform="rotate(4 150 82)" />
              <rect x="242" y="66" width="36" height="28" transform="rotate(-3 260 86)" />
              <rect x="77" y="158" width="36" height="28" transform="rotate(5 95 178)" />
              <rect x="187" y="158" width="36" height="28" transform="rotate(-4 205 178)" />
            </g>
            <g font-family="Inter, sans-serif" font-weight="800" font-size="15" fill="#efe6ff" text-anchor="middle">
              <text x="40" y="42">1912</text><text x="150" y="38">1958</text><text x="260" y="42">2004</text>
            </g>
          </svg>
        </span>
        <span class="game-name">Timeline</span>
        <span class="game-desc">Put five photographs in the order they were taken.</span>
      </div>

      <!-- =========================== OLDER OR NEWER =========================== -->
      <div class="game-card card-oldernewer is-soon" aria-disabled="true">
        <span class="game-badge">Coming soon</span>
        <span class="game-art" aria-hidden="true">
          <svg viewBox="0 0 300 220">
            <g stroke="#3a1710" stroke-width="3">
              <rect x="26" y="44" width="104" height="124" rx="5" fill="#f6f1e6" transform="rotate(-6 78 106)" />
              <rect x="170" y="44" width="104" height="124" rx="5" fill="#f6f1e6" transform="rotate(6 222 106)" />
            </g>
            <rect x="37" y="56" width="82" height="70" fill="#8a8178" transform="rotate(-6 78 106)" />
            <rect x="181" y="56" width="82" height="70" fill="#e8b58f" transform="rotate(6 222 106)" />
            <g font-family="Inter, sans-serif" font-weight="800" text-anchor="middle">
              <text x="76" y="158" font-size="20" fill="#3a1710" transform="rotate(-6 78 106)">1936</text>
              <text x="224" y="158" font-size="26" fill="#3a1710" transform="rotate(6 222 106)">?</text>
            </g>
            <g transform="translate(150 106)">
              <circle r="30" fill="#ffd8c7" stroke="#3a1710" stroke-width="3" />
              <path d="M-11 -6 L0 -17 L11 -6" fill="none" stroke="#3a1710" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M-11 6 L0 17 L11 6" fill="none" stroke="#3a1710" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            </g>
          </svg>
        </span>
        <span class="game-name">Older or Newer</span>
        <span class="game-desc">Is the next photo older or newer? Keep the streak alive.</span>
      </div>
    </div>
  </main>

  <footer class="hub-foot">
    Photographs from <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a>
  </footer>

  <script src="./js/account.js?v=20261107b"></script>
  <script>
    // Show who's signed in (if accounts are switched on).
    window.SnapshotAccount.init().then(function (user) {
      if (!user) return;
      document.getElementById('hub-account-label').textContent = user.username;
      document.getElementById('hub-account').setAttribute('aria-label', 'Account: ' + user.username);
      document.getElementById('hub-account').classList.add('is-signed-in');
    });

    // Today's date for the badge, in the visitor's language and time zone.
    (function () {
      var d = new Date();
      document.getElementById('hub-day').textContent = d.getDate();
      document.getElementById('hub-month').textContent = d.toLocaleDateString(undefined, { month: 'long' });
      document.getElementById('hub-date').setAttribute('aria-label',
        'Today: ' + d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' }));
    })();
  </script>
</body>
</html>
